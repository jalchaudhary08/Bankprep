name: BankPrep syntax check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline script found")
          open("/tmp/bankprep.js", "w", encoding="utf-8").write("\n".join(scripts))
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/bankprep.js
